    <style id="theme-vars">
:root {
  /* === Page Base (Dark, not pure black) === */
  --bg: #0E0E12;
  --surface: #16161E;
  --surface-2: #1E1E28;

  /* === Text === */
  --ink: #F0F0F5;
  --ink-2: #9898A8;
  --ink-3: #5C5C6E;

  /* === Lines & Borders === */
  --line: #2A2A35;

  /* === Brand Primary (app UI, active states, CTAs) === */
  --brand: #6366F1;
  --brand-ink: #FFFFFF;

  /* === Subject Accent Colors (data-identity for categorization) === */
  --subject-math: #4ADE80;
  --subject-english: #818CF8;
  --subject-physics: #60A5FA;
  --subject-chinese: #FBBF24;
  --subject-chemistry: #F472B6;

  /* === State Colors === */
  --state-success: #4ADE80;
  --state-warning: #FBBF24;
  --state-error: #F87171;

  /* === Radius Scale === */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 999px;

  /* === Border === */
  --border: 1px solid var(--line);

  /* === Shadows (subtle, alpha <= 0.05 for static) === */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.5);

  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* === Type Stack === */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Consolas", monospace;

  /* === Brand Semantic Aliases (for apply-html-head-contract.mjs) === */
  --brand-background: var(--bg);
  --brand-foreground: var(--ink);
  --brand-card: var(--surface);
  --brand-card-foreground: var(--ink);
  --brand-popover: var(--surface-2);
  --brand-popover-foreground: var(--ink);
  --brand-primary: var(--brand);
  --brand-primary-foreground: var(--brand-ink);
  --brand-secondary: var(--surface-2);
  --brand-secondary-foreground: var(--ink-2);
  --brand-muted: var(--surface-2);
  --brand-muted-foreground: var(--ink-2);
  --brand-accent: var(--surface-2);
  --brand-accent-foreground: var(--ink);
  --brand-border: var(--line);
  --brand-input: var(--surface-2);
  --brand-ring: var(--brand);
  --brand-radius-sm: var(--r-sm);
  --brand-radius-md: var(--r-md);
  --brand-radius-lg: var(--r-lg);
}

    </style>

<body class="min-h-screen font-sans antialiased">
    <main data-viewport-mode="app-shell">
      <style id="critical-layout">
        [data-viewport-mode="app-shell"] {
          height: 100vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          font-family: var(--font-sans);
        }
        .top-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 32px;
          border-bottom: 1px solid var(--line);
          background: var(--bg);
          flex-shrink: 0;
        }
        .top-bar-brand {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .top-bar-title {
          font-weight: 600;
          color: var(--ink);
          font-size: 16px;
        }
        .top-bar-date {
          font-size: 14px;
          color: var(--ink-2);
        }
        .dashboard-split {
          display: flex;
          flex: 1 1 0;
          overflow: hidden;
          min-height: 0;
        }
        .dashboard-clock-panel {
          width: 40%;
          min-width: 320px;
          border-right: 1px solid var(--line);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          padding: 32px;
          background: var(--bg);
        }
        .clock-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 4px 12px;
          border-radius: var(--r-pill);
          background: var(--surface-2);
          font-size: 12px;
          color: var(--ink-2);
        }
        .pulse-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--state-success);
          flex-shrink: 0;
        }
        .clock-display {
          font-family: var(--font-mono);
          font-size: clamp(3.5rem, 7vw, 6rem);
          font-weight: 600;
          letter-spacing: -0.02em;
          line-height: 1;
          margin-top: 24px;
        }
        .clock-date {
          font-size: 18px;
          color: var(--ink-2);
          margin-top: 16px;
        }
        .clock-divider {
          width: 120px;
          height: 1px;
          background: var(--line);
          margin-top: 32px;
        }
        .clock-stats {
          display: flex;
          align-items: center;
          gap: 24px;
          margin-top: 32px;
        }
        .clock-stat {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .clock-stat-label {
          font-size: 12px;
          color: var(--ink-3);
        }
        .clock-stat-value {
          font-size: 24px;
          font-weight: 600;
          margin-top: 4px;
        }
        .clock-stat-divider {
          width: 1px;
          height: 48px;
          background: var(--line);
          flex-shrink: 0;
        }
        .dashboard-cards-panel {
          flex: 1 1 0;
          overflow-y: auto;
          padding: 32px;
          min-width: 0;
        }
        .subject-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 24px;
        }
        .subject-card {
          position: relative;
          overflow: hidden;
          background: var(--surface);
          border-radius: var(--r-lg);
          padding: 24px;
          border-top: 3px solid var(--subject-color, var(--line));
          transition: background-color 150ms ease;
        }
        .subject-card:hover {
          background: var(--surface-2);
        }
        .subject-watermark {
          position: absolute;
          bottom: -8px;
          right: -8px;
          font-size: 5rem;
          font-weight: 700;
          color: var(--subject-color, var(--ink));
          opacity: 0.04;
          pointer-events: none;
          z-index: 0;
          line-height: 1;
          white-space: nowrap;
        }
        .card-content {
          position: relative;
          z-index: 1;
        }
        .card-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        }
        .card-title {
          font-size: 18px;
          font-weight: 600;
          color: var(--subject-color, var(--ink));
        }
        .task-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
          list-style: none;
          margin: 0;
          padding: 0;
        }
        .task-row {
          display: flex;
          align-items: flex-start;
          gap: 10px;
        }
        .task-check {
          width: 20px;
          height: 20px;
          border-radius: var(--r-sm);
          border: 1.5px solid var(--line);
          background: transparent;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          cursor: pointer;
          padding: 0;
          transition: border-color 120ms ease, background-color 120ms ease, transform 120ms ease;
        }
        .task-check:hover {
          border-color: var(--subject-color, var(--brand));
        }
        .task-check[data-checked="true"] {
          border-color: var(--subject-color, var(--brand));
          background: var(--subject-color, var(--brand));
        }
        .task-check:active {
          transform: scale(0.9);
        }
        .task-text {
          font-size: 14px;
          color: var(--ink);
          line-height: 1.5;
        }
        .task-text[data-done="true"] {
          color: var(--ink-3);
          text-decoration: line-through;
        }
        .progress-section {
          margin-top: 16px;
          padding-top: 16px;
          border-top: 1px solid var(--line);
        }
        .progress-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
        }
        .progress-label {
          font-size: 12px;
          color: var(--ink-3);
        }
        .progress-value {
          font-size: 12px;
          font-weight: 500;
          color: var(--subject-color, var(--ink-2));
        }
        .progress-track {
          height: 6px;
          border-radius: var(--r-pill);
          background: var(--surface-2);
          overflow: hidden;
        }
        .progress-fill {
          height: 100%;
          border-radius: var(--r-pill);
          background: var(--subject-color, var(--brand));
          transition: width 300ms ease;
        }
        .icon-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--r-md);
          background: transparent;
          border: none;
          cursor: pointer;
          padding: 6px;
          transition: background-color 120ms ease, transform 120ms ease;
        }
        .icon-btn:hover {
          background: var(--surface-2);
        }
        .icon-btn:active {
          transform: scale(0.95);
        }
        button:focus-visible {
          outline: 2px solid var(--brand);
          outline-offset: 2px;
        }
        .add-card {
          border: 2px dashed var(--line);
          background: transparent;
          border-radius: var(--r-lg);
          padding: 24px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 200px;
          width: 100%;
          cursor: pointer;
          transition: border-color 150ms ease, color 150ms ease;
          color: var(--ink-3);
        }
        .add-card:hover {
          border-color: var(--brand);
          color: var(--brand);
        }
        .add-card:active {
          transform: scale(0.98);
        }
        .add-card-label {
          font-size: 14px;
          margin-top: 8px;
        }
        @keyframes blink {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0.3; }
        }
        .colon-blink { animation: blink 1s infinite; }
        @keyframes pulse-dot {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(1.2); }
        }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
          .colon-blink, .pulse-dot { animation: none; }
        }
        @media (max-width: 1024px) {
          .dashboard-split { flex-direction: column; }
          .dashboard-clock-panel {
            width: 100%;
            min-width: 0;
            border-right: none;
            border-bottom: 1px solid var(--line);
            padding: 48px 24px;
          }
          .subject-grid { grid-template-columns: 1fr; }
        }
      </style>

    </main>
    <script>
      function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        var hoursEl = document.getElementById('clock-hours');
        var minutesEl = document.getElementById('clock-minutes');
        var secondsEl = document.getElementById('clock-seconds');
        if (hoursEl) hoursEl.textContent = h;
        if (minutesEl) minutesEl.textContent = m;
        if (secondsEl) secondsEl.textContent = s;
      }
      updateClock();
      setInterval(updateClock, 1000);
    </script>
    <script>lucide.createIcons();</script>
