name: Sync Release to Gitee

on:
  # GitHub 发布 Release 后自动同步
  release:
    types:
      - published

  # 允许手动同步已有 Release
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release Tag，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-release:
    name: Sync Release to Gitee
    runs-on: ubuntu-latest

    env:
      GITEE_USERNAME: EdgeHH
      GITEE_OWNER: EdgeHH
      GITEE_REPO: Pancake

    steps:
      # ============================================================
      # 1. 获取需要同步的 Tag
      # ============================================================
      - name: Resolve Release Tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          AUTO_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="${AUTO_TAG}"
          fi

          if [ -z "${TAG}" ]; then
            echo "❌ 无法获取 Release Tag"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "准备同步 Release"
          echo "Tag: ${TAG}"
          echo "========================================"


      # ============================================================
      # 2. 获取 GitHub Release 信息
      # ============================================================
      - name: Get GitHub Release Information
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "读取 GitHub Release: ${TAG}"

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > github-release.json

          echo ""
          echo "Release 信息："

          jq '{
            tag: .tag_name,
            name: .name,
            published_at: .published_at,
            prerelease: .prerelease,
            asset_count: (.assets | length),
            assets: [.assets[].name]
          }' github-release.json


      # ============================================================
      # 3. 等待 Gitee 自带镜像同步 Tag
      #
      # Gitee 的 GitHub 镜像同步可能比 GitHub Release Action 慞几十秒
      # 所以这里最多等待约 5 分钟
      #
      # 注意：这里只查询 Tag，不上传任何 Git 对象
      # ============================================================
      - name: Wait for Gitee Mirror Tag
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN}" ]; then
            echo "❌ 没有设置 GITEE_TOKEN"
            exit 1
          fi

          AUTH=$(printf '%s:%s' \
            "${GITEE_USERNAME}" \
            "${GITEE_TOKEN}" \
            | base64 -w 0)

          echo "::add-mask::${AUTH}"

          GITEE_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          echo "等待 Gitee 镜像出现 Tag: ${TAG}"

          for i in {1..20}; do

            echo "检查 Tag，第 ${i}/20 次..."

            if GIT_TERMINAL_PROMPT=0 \
              git \
                -c http.extraheader="Authorization: Basic ${AUTH}" \
                ls-remote \
                --tags \
                "${GITEE_URL}" \
                "refs/tags/${TAG}" \
              | grep -q "refs/tags/${TAG}$"
            then

              echo ""
              echo "✅ Gitee 已同步 Tag: ${TAG}"
              exit 0

            fi

            if [ "${i}" -lt 20 ]; then
              sleep 15
            fi

          done

          echo ""
          echo "❌ 等待 Gitee Tag 超时。"
          echo ""
          echo "请检查："
          echo "1. Gitee 仓库镜像是否已经开启自动同步"
          echo "2. GitHub 是否已经存在 ${TAG}"
          echo "3. Gitee 镜像是否同步完成"
          echo ""
          echo "等 Gitee Tag 出现后，可以手动重新运行本 Workflow。"

          exit 1


      # ============================================================
      # 4. 下载 GitHub Release 附件
      # ============================================================
      - name: Download GitHub Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p assets

          ASSET_COUNT=$(jq '.assets | length' github-release.json)

          echo "附件数量: ${ASSET_COUNT}"

          if [ "${ASSET_COUNT}" -eq 0 ]; then
            echo "ℹ️ 当前 Release 没有附件"
            exit 0
          fi

          echo "开始下载 GitHub Release 附件..."

          gh release download \
            "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir assets

          echo ""
          echo "下载完成："

          ls -lh assets/


         # ============================================================
      # 5. 删除旧 Release，并重新创建
      # ============================================================
      - name: Recreate Gitee Release
        id: gitee_release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          API_BASE="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          RELEASE_NAME=$(jq -r '.name // .tag_name' github-release.json)
          RELEASE_BODY=$(jq -r '.body // ""' github-release.json)

          TAG_ENCODED=$(jq -rn \
            --arg tag "${TAG}" \
            '$tag | @uri')

          echo "检查 Gitee 是否已有 Release: ${TAG}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output old-release.json \
            --write-out "%{http_code}" \
            --retry 3 \
            --retry-all-errors \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            "${API_BASE}/releases/tags/${TAG_ENCODED}")

          # 已存在 -> 删除整个 Release
          if [ "${HTTP_CODE}" = "200" ]; then

            OLD_RELEASE_ID=$(jq -r '.id' old-release.json)

            echo "发现已有 Gitee Release"
            echo "Release ID: ${OLD_RELEASE_ID}"
            echo "删除旧 Release..."

            DELETE_CODE=$(curl \
              --silent \
              --show-error \
              --output delete-response.txt \
              --write-out "%{http_code}" \
              --retry 3 \
              --retry-all-errors \
              -X DELETE \
              -H "Authorization: Bearer ${GITEE_TOKEN}" \
              "${API_BASE}/releases/${OLD_RELEASE_ID}")

            if [ "${DELETE_CODE}" -ge 200 ] && [ "${DELETE_CODE}" -lt 300 ]; then
              echo "✅ 旧 Release 已删除"
            else
              echo "❌ 删除旧 Release 失败"
              echo "HTTP: ${DELETE_CODE}"
              cat delete-response.txt || true
              exit 1
            fi

          elif [ "${HTTP_CODE}" = "404" ]; then

            echo "当前 Tag 还没有 Gitee Release"

          else

            echo "❌ 查询 Gitee Release 失败"
            echo "HTTP: ${HTTP_CODE}"
            cat old-release.json || true
            exit 1

          fi


          echo ""
          echo "创建新的 Gitee Release..."

          CREATE_CODE=$(curl \
            --silent \
            --show-error \
            --output gitee-release.json \
            --write-out "%{http_code}" \
            --retry 3 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "name=${RELEASE_NAME}" \
            --data-urlencode "body=${RELEASE_BODY}" \
            "${API_BASE}/releases")

          if [ "${CREATE_CODE}" -lt 200 ] || [ "${CREATE_CODE}" -ge 300 ]; then
            echo "❌ 创建 Gitee Release 失败"
            echo "HTTP: ${CREATE_CODE}"
            cat gitee-release.json || true
            exit 1
          fi

          RELEASE_ID=$(jq -r '.id' gitee-release.json)

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "❌ 没有获取到 Gitee Release ID"
            cat gitee-release.json
            exit 1
          fi

          echo "✅ 新 Release 创建成功"
          echo "Release ID: ${RELEASE_ID}"

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. 上传 Release 附件
      # ============================================================
      - name: Upload Assets to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -euo pipefail

          API_BASE="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          shopt -s nullglob

          FILES=(assets/*)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ℹ️ 没有附件需要上传"
            exit 0
          fi

          echo "准备上传 ${#FILES[@]} 个附件"

          for FILE in "${FILES[@]}"; do

            FILE_NAME=$(basename "${FILE}")
            FILE_SIZE=$(du -h "${FILE}" | cut -f1)

            echo ""
            echo "========================================"
            echo "上传: ${FILE_NAME}"
            echo "大小: ${FILE_SIZE}"
            echo "========================================"

            RESPONSE_FILE=$(mktemp)

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              -X POST \
              -H "Authorization: Bearer ${GITEE_TOKEN}" \
              -F "file=@${FILE}" \
              "${API_BASE}/releases/${RELEASE_ID}/attach_files")

            if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then

              echo "✅ 上传成功: ${FILE_NAME}"

              DOWNLOAD_URL=$(jq -r \
                '.browser_download_url // .download_url // empty' \
                "${RESPONSE_FILE}" \
                2>/dev/null || true)

              if [ -n "${DOWNLOAD_URL}" ]; then
                echo "下载地址: ${DOWNLOAD_URL}"
              fi

            else

              echo "❌ 上传失败: ${FILE_NAME}"
              echo "HTTP: ${HTTP_CODE}"

              cat "${RESPONSE_FILE}" || true

              rm -f "${RESPONSE_FILE}"

              exit 1

            fi

            rm -f "${RESPONSE_FILE}"

          done


      # ============================================================
      # 7. 完成
      # ============================================================
      - name: Sync Completed
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo ""
          echo "========================================"
          echo "       ✅ Gitee Release 同步完成"
          echo "========================================"
          echo ""
          echo "版本: ${TAG}"
          echo ""
          echo "GitHub:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo ""
          echo "Gitee:"
          echo "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases"
