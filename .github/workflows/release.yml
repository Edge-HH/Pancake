name: 📦 构建与发布

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号，例如 1.2.3（手动运行只生成产物，不创建 Release）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: 🏷️ 解析并校验版本号
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME.TrimStart('v', 'V') } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须使用 major.minor.patch 格式，例如 1.2.3。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 📚 还原项目依赖
        run: dotnet restore .\src\Pancake\Pancake.csproj

      - name: 🔨 编译 x64 正式版本
        run: dotnet build .\src\Pancake\Pancake.csproj -c Release -p:Platform=x64 --no-restore --nologo

      - name: 🧪 验证设置逻辑
        run: dotnet run --project .\tests\SettingsLogic\SettingsLogic.csproj -c Release

      - name: 🧩 验证项目文件与排版
        run: dotnet run --project .\tests\ProjectLogic\ProjectLogic.csproj -c Release

      - name: 🔄 验证更新覆盖与回滚
        run: dotnet run --project .\tests\UpdateLogic\UpdateLogic.csproj -c Release

      - name: 🔎 检查界面与交互约定
        shell: pwsh
        run: |
          .\tests\verify-color-formatting-contract.ps1
          .\tests\verify-icon-font-contract.ps1
          .\tests\verify-interaction-contract.ps1
          .\tests\verify-requested-ui-contract.ps1
          .\tests\verify-rich-text-roundtrip.ps1

      - name: 🪟 验证真实窗口与新版设置
        shell: pwsh
        run: |
          dotnet publish .\src\Pancake\Pancake.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:EnableUiVerification=true -o .\artifacts\ui-check --nologo
          if ($LASTEXITCODE -ne 0) { throw 'UI 验证程序构建失败。' }
          .\tests\verify-ui.ps1 -PublishDirectory .\artifacts\ui-check -EvidenceDirectory .\artifacts\ui-evidence

      - name: 📷 保留窗口测试证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Pancake-ui-evidence
          path: .\artifacts\ui-evidence
          if-no-files-found: ignore

      - name: 📦 生成自带运行环境的程序
        shell: pwsh
        run: |
          dotnet publish .\src\Pancake\Pancake.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:EnableUiVerification=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -o .\artifacts\publish `
            --nologo

      - name: 🪶 精简多余语言资源
        shell: pwsh
        run: .\installer\Optimize-Publish.ps1 -PublishDirectory .\artifacts\publish

      - name: 🗜️ 压缩便携版程序
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip `
            -CompressionLevel Optimal

      - name: 🚀 解压并验证成品启动
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip -DestinationPath .\artifacts\package-check
          .\tests\verify-release-startup.ps1 -PublishDirectory .\artifacts\package-check

      - name: 📤 上传便携版产物
        uses: actions/upload-artifact@v7
        with:
          name: Pancake-win-x64-${{ steps.version.outputs.version }}
          path: .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: 🎉 创建 GitHub 正式发布
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --generate-notes `
            --title "Pancake ${{ github.ref_name }}"

    permissions:
      contents: write
