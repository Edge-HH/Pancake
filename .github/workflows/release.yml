name: 📦 构建与发布

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号，例如 1.2.3（手动运行只生成产物，不创建 Release）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # 三端各自在原生运行器上构建，避免交叉构建掩盖平台依赖问题。
  # Linux 与 macOS 的 Test 步骤覆盖核心逻辑；UpdateLogic 依赖 7-Zip 与 PowerShell，只在 Windows 运行。
  build-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pancake-win-x64
            os: windows-latest
            rid: win-x64
            platform: windows
          - name: Pancake-linux-x64
            os: ubuntu-24.04
            rid: linux-x64
            platform: linux
          - name: Pancake-linux-arm64
            os: ubuntu-24.04
            rid: linux-arm64
            platform: linux
          - name: Pancake-macos-arm64
            os: macos-15
            rid: osx-arm64
            platform: macos
          - name: Pancake-macos-x64
            os: macos-15
            rid: osx-x64
            platform: macos

    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: 🏷️ 解析并校验版本号
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME.TrimStart('v', 'V') } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须使用 major.minor.patch 格式，例如 1.2.3。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 🧪 验证核心逻辑
        run: |
          dotnet run --project ./tests/SettingsLogic/SettingsLogic.csproj -c Release
          dotnet run --project ./tests/ProjectLogic/ProjectLogic.csproj -c Release
          dotnet run --project ./tests/RichTextLogic/RichTextLogic.csproj -c Release

      # Headless 界面测试不需要显示设备：三个平台都跑，覆盖窗口与设置页构建、主题切换、
      # 磁贴布局与命中区域、全屏退出提示与按指针时的自动隐藏。运行共用的 UI 库需要验证开关。
      - name: 🖥️ 验证界面构建与交互（Headless）
        run: dotnet run --project ./tests/UiHeadless/UiHeadless.csproj -c Release -p:EnableUiVerification=true

      # Headless 自检会输出各缩放档位的看板截图与设置页截图；失败时把它们留下来便于定位。
      - name: 📸 上传 Headless 证据截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-headless-evidence
          path: ./tests/UiHeadless/bin/**/headless-evidence/**
          if-no-files-found: ignore

      - name: 🔄 验证更新覆盖与回滚
        if: matrix.platform == 'windows'
        run: dotnet run --project ./tests/UpdateLogic/UpdateLogic.csproj -c Release

      - name: 🪟 验证设置页可构建
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet publish ./src/Pancake.Desktop/Pancake.Desktop.csproj -c Release -r win-x64 --self-contained true -p:EnableUiVerification=true -o ./artifacts/ui-check --nologo
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-settings-pages' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(120000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/settings-pages.txt)) { throw '设置页验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/settings-pages.txt -Raw
          if ($result -notmatch 'ALL_SECTIONS_OK') { throw "设置页验证失败：$result" }

      - name: 🖼️ 验证图片导出可渲染
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-export' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(120000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/export-check.txt)) { throw '导出验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/export-check.txt -Raw
          if ($result -notmatch 'EXPORT_OK 800x450') { throw "导出验证失败：$result" }

      - name: 🔍 验证作业板缩放与滚动范围
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-zoom' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(120000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/zoom-check.txt)) { throw '缩放验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/zoom-check.txt -Raw
          if ($result -notmatch 'ZOOM_OK') { throw "缩放验证失败：$result" }

      - name: 🧭 验证浮岛定位与控制窗自动隐藏
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-islands' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(120000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/islands-check.txt)) { throw '浮岛验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/islands-check.txt -Raw
          if ($result -notmatch 'ISLANDS_OK') { throw "浮岛验证失败：$result" }

      - name: 📐 验证自动排列按内容收紧
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-autolayout' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(180000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/autolayout-check.txt)) { throw '自动排列验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/autolayout-check.txt -Raw
          if ($result -notmatch 'AUTOLAYOUT_OK') { throw "自动排列验证失败：$result" }

      - name: ⬆️ 验证更新下载、校验与解压
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          # 真实下载最新 Release 的便携包并在临时目录解压，验证完整更新链路。
          PANCAKE_UPDATE_VERIFY_DOWNLOAD: '1'
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-update' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(600000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/update-check.txt)) { throw '更新验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/update-check.txt -Raw
          # GitHub 对匿名请求按 IP 限流时跳过（外部配额问题），其它失败一律判失败。
          if ($result -notmatch 'UPDATE_OK' -and $result -notmatch 'UPDATE_SKIPPED_RATE_LIMIT') { throw "更新验证失败：$result" }

      - name: 🎞️ 验证背景播放队列轮播
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-playlist' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(180000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/playlist-check.txt)) { throw '播放队列验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/playlist-check.txt -Raw
          if ($result -notmatch 'PLAYLIST_OK') { throw "播放队列验证失败：$result" }

      - name: 🎬 验证视频背景可解码播放
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $video = Join-Path $env:TEMP 'pancake-ci-test-video.mp4'
          ffmpeg -y -f lavfi -i "testsrc=size=320x180:rate=15:duration=4" -pix_fmt yuv420p $video
          if (-not (Test-Path $video)) { throw '未能生成用于视频验证的测试片段。' }
          $env:PANCAKE_VIDEO_PATH = $video
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-video' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(180000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/video-check.txt)) { throw '视频验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/video-check.txt -Raw
          if ($result -notmatch 'VIDEO_OK') { throw "视频验证失败：$result" }

      - name: 🌐 验证网页壁纸可加载
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-web' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(180000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/web-check.txt)) { throw '网页壁纸验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/web-check.txt -Raw
          if ($result -notmatch 'WEB_OK') { throw "网页壁纸验证失败：$result" }

      - name: 📝 验证富文本悬浮岛
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/ui-check/Pancake.exe -ArgumentList '--windowed','--verify-richtext-island' -PassThru -WorkingDirectory ./artifacts/ui-check
          $process.WaitForExit(180000) | Out-Null
          if (-not (Test-Path ./artifacts/ui-check/richtext-island-check.txt)) { throw '富文本悬浮岛验证未产出结果文件。' }
          $result = Get-Content ./artifacts/ui-check/richtext-island-check.txt -Raw
          if ($result -notmatch 'RICHTEXT_ISLAND_OK') { throw "富文本悬浮岛验证失败：$result" }

      - name: 📦 生成自带运行环境的程序
        run: >
          dotnet publish ./src/Pancake.Desktop/Pancake.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishPlatform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.version }}
          -o ./artifacts/${{ matrix.name }}
          --nologo

      - name: 🍎 组装 macOS 应用包
        if: matrix.platform == 'macos'
        run: |
          set -e
          bundle="./artifacts/${{ matrix.name }}/Pancake.app"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          cp -r ./artifacts/${{ matrix.name }}/. "$bundle/Contents/MacOS/"
          mv "$bundle/Contents/MacOS/Info.plist" "$bundle/Contents/Info.plist"
          cp ./src/Pancake/Assets/Fonts/*.ttf "$bundle/Contents/Resources/" 2>/dev/null || true
          chmod +x "$bundle/Contents/MacOS/Pancake"

      - name: 🗜️ 打包
        shell: pwsh
        run: |
          $name = '${{ matrix.name }}-${{ steps.version.outputs.version }}'
          if ('${{ matrix.platform }}' -eq 'linux') {
            tar -czf "./artifacts/$name.tar.gz" -C "./artifacts/${{ matrix.name }}" .
            "archive=artifacts/$name.tar.gz" >> $env:GITHUB_OUTPUT
          } else {
            Compress-Archive -Path "./artifacts/${{ matrix.name }}/*" -DestinationPath "./artifacts/$name.zip" -CompressionLevel Optimal
            "archive=artifacts/$name.zip" >> $env:GITHUB_OUTPUT
          }
        id: package

      - name: 📤 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # 三端产物汇总后一次性发布，避免每个平台各建一个同名 Release。
  release:
    name: 🎉 创建正式发布
    needs: build-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 📥 下载全部平台产物
        uses: actions/download-artifact@v5
        with:
          path: ./out
          merge-multiple: true

      - name: 🎉 创建 GitHub 正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ./out/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "Pancake ${{ github.ref_name }}"
