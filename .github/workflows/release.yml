name: 📦 构建与发布

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号，例如 1.2.3（手动运行只生成产物，不创建 Release）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: 🏷️ 解析并校验版本号
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME.TrimStart('v', 'V') } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须使用 major.minor.patch 格式，例如 1.2.3。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 📦 生成自带运行环境的程序
        shell: pwsh
        run: |
          dotnet publish .\src\Pancake\Pancake.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:EnableUiVerification=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -o .\artifacts\publish `
            --nologo

      - name: 🪶 精简多余语言资源
        shell: pwsh
        run: .\installer\Optimize-Publish.ps1 -PublishDirectory .\artifacts\publish

      - name: 🗜️ 压缩便携版程序
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip `
            -CompressionLevel Optimal

      - name: 🚀 验证成品启动
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip -DestinationPath .\artifacts\package-check
          .\tests\verify-release-startup.ps1 -PublishDirectory .\artifacts\package-check

      - name: 📤 上传便携版产物
        uses: actions/upload-artifact@v7
        with:
          name: Pancake-win-x64-${{ steps.version.outputs.version }}
          path: .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: 🎉 创建 GitHub 正式发布
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\artifacts\Pancake-win-x64-${{ steps.version.outputs.version }}.zip `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --generate-notes `
            --title "Pancake ${{ github.ref_name }}"
